name: Build and Deploy Eleventy site (branch demo)

on:
  push:
    branches:
      - 11ty-restructure

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npx @11ty/eleventy

      # Deploy the built _site folder back into the SAME branch
      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r _site/* .
          rm -rf _site
          git add .
          git commit -m "Build Eleventy site [skip ci]" || echo "No changes to commit"
          git push origin 11ty-restructure